<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Казино Арты — Колесо</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Russo+One&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, #1a0f0a, #0a0a0f 70%);
            z-index: -2;
        }
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,215,0,0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,215,0,0.2), transparent),
                radial-gradient(3px 3px at 60% 20%, rgba(255,215,0,0.4), transparent),
                radial-gradient(2px 2px at 80% 60%, rgba(255,215,0,0.2), transparent),
                radial-gradient(2px 2px at 10% 90%, rgba(255,215,0,0.3), transparent),
                radial-gradient(2px 2px at 90% 10%, rgba(255,215,0,0.3), transparent);
            background-size: 200% 200%;
            animation: twinkle 8s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .container {
            max-width: 900px;
            width: 95%;
            margin: 20px auto;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 40px;
            padding: 25px 30px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            margin-bottom: 25px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ff6a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }
        .logo i {
            -webkit-text-fill-color: initial;
            color: #ffd700;
            margin-right: 8px;
        }
        .balance-box {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            padding: 8px 22px;
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .balance-box i { color: #ffd700; }
        .balance-box span { color: #ffd700; }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 550px;
            margin: 0 auto 20px;
        }
        canvas#wheelCanvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2), 0 0 100px rgba(255, 215, 0, 0.05);
        }

        .multiplier-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 20px;
            width: 100%;
        }
        .multiplier-btn {
            background: transparent;
            border: 2px solid rgba(255, 215, 0, 0.2);
            color: #aaa;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .multiplier-btn:hover {
            border-color: rgba(255, 215, 0, 0.5);
            color: #fff;
        }
        .multiplier-btn.active {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin: 10px 0 15px;
            width: 100%;
        }
        .bet-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 5px 18px 5px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .bet-group label {
            font-size: 0.9rem;
            color: #aaa;
        }
        .bet-group input {
            background: transparent;
            border: none;
            color: #ffd700;
            font-size: 1.2rem;
            font-weight: 700;
            width: 80px;
            font-family: 'Orbitron', sans-serif;
            outline: none;
            text-align: center;
        }
        .bet-group input::-webkit-inner-spin-button { -webkit-appearance: none; }
        .bet-group input:focus { border-bottom: 1px solid #ffd700; }

        .action-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .spin-btn {
            background: linear-gradient(145deg, #ffd700, #ff8c00);
            border: none;
            color: #0a0a0f;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 12px 32px;
            border-radius: 40px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .spin-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }
        .spin-btn:disabled {
            opacity: 0.5;
            transform: scale(0.98);
            cursor: not-allowed;
            box-shadow: none;
        }

        .boost-btn {
            background: transparent;
            border: 2px solid #ff6a00;
            color: #ff6a00;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 12px 24px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            box-shadow: 0 0 20px rgba(255, 100, 0, 0.1);
        }
        .boost-btn:hover:not(:disabled) {
            background: rgba(255, 100, 0, 0.15);
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 100, 0, 0.3);
        }
        .boost-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: scale(0.95);
        }
        .boost-btn.active {
            background: rgba(255, 100, 0, 0.2);
            border-color: #ffd700;
            color: #ffd700;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.3);
        }

        .result-box {
            text-align: center;
            min-height: 70px;
            font-size: 1.1rem;
            padding: 12px;
            color: #ddd;
            font-family: 'Segoe UI', sans-serif;
            background: rgba(255, 215, 0, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            width: 100%;
            max-width: 500px;
            margin-top: 5px;
        }
        .result-box .win { color: #ffd700; font-weight: 700; }
        .result-box .lose { color: #ff4466; font-weight: 700; }
        .result-box .boost-label { color: #ff6a00; font-weight: 700; }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #555;
            font-size: 0.7rem;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 215, 0, 0.05);
            padding-top: 20px;
        }
        .footer span { color: #ffd700; }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .logo { font-size: 1.3rem; }
            .balance-box { font-size: 1rem; padding: 6px 16px; }
            .controls { gap: 12px; }
            .spin-btn { padding: 10px 24px; font-size: 1rem; }
            .boost-btn { padding: 10px 18px; font-size: 0.8rem; }
            .bet-group input { width: 60px; font-size: 1rem; }
            .multiplier-btn { font-size: 0.8rem; padding: 6px 14px; }
        }
    </style>
</head>
<body>
    <div class="particles"></div>
    <div class="container">
        <header class="header">
            <div class="logo"><i class="fas fa-bolt"></i> АРТА КАЗИНО</div>
            <div class="balance-box">
                <i class="fas fa-coins"></i> Баланс: <span id="balanceDisplay">10000</span>
            </div>
        </header>

        <div class="game-area">
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="600" height="600"></canvas>
            </div>

            <div class="multiplier-selector" id="multiplierSelector">
                <button class="multiplier-btn active" data-mult="2">x2</button>
                <button class="multiplier-btn" data-mult="3">x3</button>
                <button class="multiplier-btn" data-mult="5">x5</button>
                <button class="multiplier-btn" data-mult="10">x10</button>
                <button class="multiplier-btn" data-mult="20">x20</button>
                <button class="multiplier-btn" data-mult="50">x50</button>
            </div>

            <div class="controls">
                <div class="bet-group">
                    <label><i class="fas fa-gem"></i> Ставка</label>
                    <input type="number" id="betInput" value="50" min="1" step="1" />
                </div>
                <div class="action-buttons">
                    <button class="spin-btn" id="spinBtn"><i class="fas fa-sync-alt"></i> КРУТИТЬ</button>
                    <button class="boost-btn" id="boostBtn"><i class="fas fa-bolt"></i> ПОДКРУТКА (x15)</button>
                </div>
            </div>

            <div class="result-box" id="resultBox">
                <span id="resultText">Выберите множитель и нажмите «Крутить»</span>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 <span>Арта</span> — удача на твоей стороне. Играй ответственно (всё понарошку).</p>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script>
        (function() {
            // ---------- Константы и состояние ----------
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');

            let state = {
                balance: 10000,
                currentAngle: 0,          // сырой угол (может быть > 2π)
                isSpinning: false,
                selectedMultiplier: 2,
                animationId: null,
                boostActive: false,       // активна ли подкрутка
                centerX: 300,
                centerY: 300,
                radius: 260,
                sectors: [] // массив { start, end, type, label, color }
            };

            // DOM
            const balanceDisplay = document.getElementById('balanceDisplay');
            const betInput = document.getElementById('betInput');
            const spinBtn = document.getElementById('spinBtn');
            const boostBtn = document.getElementById('boostBtn');
            const resultText = document.getElementById('resultText');
            const multiplierBtns = document.querySelectorAll('.multiplier-btn');

            // ---------- Вспомогательные функции ----------
            function normalizeAngle(angle) {
                angle = angle % (2 * Math.PI);
                if (angle < 0) angle += 2 * Math.PI;
                return angle;
            }

            // ---------- Расчёт секторов ----------
            function buildSectors(mult) {
                const multAngle = (2 * Math.PI) / mult;
                const zeroAngle = 2 * Math.PI - multAngle;
                const centerZero = -Math.PI / 2;
                const zeroStart = centerZero - zeroAngle / 2;
                const zeroEnd = centerZero + zeroAngle / 2;
                const multStart = zeroEnd;
                let multEnd = zeroStart + 2 * Math.PI;
                return [
                    { start: zeroStart, end: zeroEnd, type: 'zero', label: 'x0', color: '#2a2a3a' },
                    { start: multStart, end: multEnd, type: 'mult', label: 'x' + mult, color: '#3a7a5a' }
                ];
            }

            // ---------- Обновление геометрии ----------
            function updateGeometry() {
                const w = canvas.width;
                const h = canvas.height;
                state.centerX = w / 2;
                state.centerY = h / 2;
                state.radius = Math.min(w, h) * 0.42;
            }

            // ---------- Отрисовка ----------
            function drawWheel() {
                const { centerX, centerY, radius, sectors } = state;
                const angle = normalizeAngle(state.currentAngle);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.shadowColor = 'rgba(255,215,0,0.15)';
                ctx.shadowBlur = 30;

                sectors.forEach(seg => {
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, seg.start, seg.end);
                    ctx.closePath();
                    ctx.fillStyle = seg.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,215,0,0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.shadowBlur = 30;

                    let mid = (seg.start + seg.end) / 2;
                    let midNorm = normalizeAngle(mid);
                    const textR = radius * 0.7;
                    const x = centerX + Math.cos(midNorm) * textR;
                    const y = centerY + Math.sin(midNorm) * textR;

                    ctx.save();
                    ctx.translate(x, y);
                    let rot = midNorm;
                    if (rot > Math.PI/2 && rot < 3*Math.PI/2) rot += Math.PI;
                    ctx.rotate(rot);
                    ctx.font = 'bold 20px Orbitron, sans-serif';
                    ctx.fillStyle = (seg.type === 'zero') ? '#fff' : '#ffd700';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(seg.label, 0, 0);
                    ctx.restore();
                });

                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(255,215,0,0.4)';
                ctx.lineWidth = 6;
                ctx.stroke();
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(255,215,0,0.1)';

                ctx.beginPath();
                ctx.arc(centerX, centerY, 18, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(255,215,0,0.6)';
                ctx.fill();
                ctx.shadowBlur = 0;

                drawArrow(angle);
            }

            function drawArrow(angle) {
                const { centerX, centerY, radius } = state;
                const arrowLength = radius * 0.2;
                const baseWidth = 18;
                const tipOffset = 6;

                const tipX = centerX + (radius + tipOffset) * Math.cos(angle);
                const tipY = centerY + (radius + tipOffset) * Math.sin(angle);
                const backX = centerX + (radius + tipOffset - arrowLength) * Math.cos(angle);
                const backY = centerY + (radius + tipOffset - arrowLength) * Math.sin(angle);

                const perpX = -Math.sin(angle);
                const perpY = Math.cos(angle);

                const p1x = backX + baseWidth/2 * perpX;
                const p1y = backY + baseWidth/2 * perpY;
                const p2x = backX - baseWidth/2 * perpX;
                const p2y = backY - baseWidth/2 * perpY;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(tipX, tipY);
                ctx.lineTo(p1x, p1y);
                ctx.lineTo(p2x, p2y);
                ctx.closePath();

                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = 'rgba(255,215,0,0.9)';
                ctx.shadowBlur = 25;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            // ---------- Определение сектора по углу (для проверки) ----------
            function getSector(rawAngle) {
                const a = normalizeAngle(rawAngle);
                const zeroStartNorm = normalizeAngle(state.sectors[0].start);
                const zeroEndNorm = normalizeAngle(state.sectors[0].end);
                if (zeroStartNorm < zeroEndNorm) {
                    if (a >= zeroStartNorm && a <= zeroEndNorm) return 'zero';
                } else {
                    if (a >= zeroStartNorm || a <= zeroEndNorm) return 'zero';
                }
                return 'mult';
            }

            // ---------- Генерация целевого угла с учётом подкрутки ----------
            function getTargetAngle(startAngle, boost) {
                const extraRotations = (5 + Math.random() * 5) * 2 * Math.PI;
                let targetNormalized;
                if (boost) {
                    // с вероятностью 15/16 — в сектор mult, иначе в zero
                    if (Math.random() < 15/16) {
                        // сектор mult
                        const multStart = state.sectors[1].start;
                        const multEnd = state.sectors[1].end;
                        // Угол в пределах [multStart, multEnd] (может быть > 2π)
                        // Приводим к [0, 2π) для выбора
                        let s = normalizeAngle(multStart);
                        let e = normalizeAngle(multEnd);
                        if (s < e) {
                            targetNormalized = s + Math.random() * (e - s);
                        } else {
                            // пересекает 0
                            if (Math.random() < 0.5) {
                                targetNormalized = s + Math.random() * (2 * Math.PI - s);
                            } else {
                                targetNormalized = Math.random() * e;
                            }
                        }
                    } else {
                        // сектор zero
                        const zeroStart = state.sectors[0].start;
                        const zeroEnd = state.sectors[0].end;
                        let s = normalizeAngle(zeroStart);
                        let e = normalizeAngle(zeroEnd);
                        if (s < e) {
                            targetNormalized = s + Math.random() * (e - s);
                        } else {
                            if (Math.random() < 0.5) {
                                targetNormalized = s + Math.random() * (2 * Math.PI - s);
                            } else {
                                targetNormalized = Math.random() * e;
                            }
                        }
                    }
                } else {
                    // без подкрутки — равномерно по всему кругу
                    targetNormalized = Math.random() * 2 * Math.PI;
                }

                // Вычисляем количество полных оборотов от startAngle + extraRotations
                const base = startAngle + extraRotations;
                const revolutions = Math.floor(base / (2 * Math.PI));
                const targetAngle = revolutions * 2 * Math.PI + targetNormalized;
                // Убедимся, что targetAngle > startAngle (добавим лишний оборот при необходимости)
                if (targetAngle <= startAngle) {
                    return targetAngle + 2 * Math.PI;
                }
                return targetAngle;
            }

            // ---------- Обновление UI ----------
            function updateMultiplier(mult) {
                if (state.isSpinning) return;
                state.selectedMultiplier = mult;
                state.sectors = buildSectors(mult);
                drawWheel();
                updatePotentialWin();
                multiplierBtns.forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.mult) === mult);
                });
            }

            function updatePotentialWin() {
                const bet = parseInt(betInput.value) || 0;
                const win = bet * state.selectedMultiplier;
                let boostText = state.boostActive ? ' <span class="boost-label">(Подкрутка x15 активна!)</span>' : '';
                if (!state.isSpinning) {
                    resultText.innerHTML = `Ставка ${bet} × ${state.selectedMultiplier} = <span class="win">${win}</span> (если выпадет x${state.selectedMultiplier})${boostText}`;
                }
            }

            function updateBalance() {
                balanceDisplay.textContent = state.balance;
            }

            function updateBoostUI() {
                if (state.boostActive) {
                    boostBtn.classList.add('active');
                    boostBtn.disabled = true;
                } else {
                    boostBtn.classList.remove('active');
                    boostBtn.disabled = state.isSpinning;
                }
                updatePotentialWin();
            }

            // ---------- Вращение (новая анимация с интерполяцией к целевому углу) ----------
            function startSpin() {
                if (state.isSpinning) return;
                const bet = parseInt(betInput.value);
                if (isNaN(bet) || bet <= 0) {
                    resultText.innerHTML = '⚠️ Введите корректную положительную ставку';
                    return;
                }
                if (bet > state.balance) {
                    resultText.innerHTML = '⚠️ Недостаточно средств!';
                    return;
                }

                if (state.animationId) {
                    cancelAnimationFrame(state.animationId);
                    state.animationId = null;
                }

                state.balance -= bet;
                updateBalance();

                state.isSpinning = true;
                spinBtn.disabled = true;
                boostBtn.disabled = true;

                const boostUsed = state.boostActive;
                state.boostActive = false;
                updateBoostUI();

                const startAngle = state.currentAngle;
                const targetAngle = getTargetAngle(startAngle, boostUsed);

                // Сохраняем целевой угол для проверки
                const duration = 7000;
                const startTime = performance.now();

                resultText.innerHTML = '🌀 Стрелка крутится... 7 секунд' + (boostUsed ? ' <span class="boost-label">(Подкрутка активна!)</span>' : '');

                function easeOutCubic(t) {
                    return 1 - Math.pow(1 - t, 3);
                }

                function animate(timestamp) {
                    const elapsed = timestamp - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const eased = easeOutCubic(progress);
                    const current = startAngle + (targetAngle - startAngle) * eased;
                    state.currentAngle = current;
                    drawWheel();

                    if (progress < 1) {
                        state.animationId = requestAnimationFrame(animate);
                    } else {
                        // Фиксируем точно targetAngle
                        state.currentAngle = targetAngle;
                        drawWheel();
                        // Определяем сектор (для информации)
                        const sector = getSector(targetAngle);
                        let msg = '';
                        if (sector === 'zero') {
                            msg = `💔 Проигрыш! Выпал x0. Ставка сгорела.`;
                            resultText.innerHTML = `<span class="lose">${msg}</span>`;
                        } else {
                            const winAmount = bet * state.selectedMultiplier;
                            state.balance += winAmount;
                            updateBalance();
                            msg = `🎉 Выигрыш! x${state.selectedMultiplier} = ${winAmount} денег!`;
                            if (boostUsed) msg += ' <span class="boost-label">(Подкрутка сработала!)</span>';
                            resultText.innerHTML = `<span class="win">${msg}</span>`;
                        }
                        state.isSpinning = false;
                        spinBtn.disabled = false;
                        boostBtn.disabled = false;
                        state.animationId = null;
                        updateBoostUI();
                    }
                }

                state.animationId = requestAnimationFrame(animate);
            }

            // ---------- Активация подкрутки ----------
            function activateBoost() {
                if (state.isSpinning) return;
                if (state.boostActive) return;
                state.boostActive = true;
                updateBoostUI();
                resultText.innerHTML = '⚡ Подкрутка активирована! Следующий спин увеличит шанс выигрыша в 15 раз.';
            }

            // ---------- Инициализация ----------
            function init() {
                canvas.width = 600;
                canvas.height = 600;
                updateGeometry();

                state.sectors = buildSectors(2);
                state.currentAngle = 0;
                drawWheel();
                updateBalance();
                updatePotentialWin();
                updateBoostUI();

                multiplierBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const mult = parseInt(this.dataset.mult);
                        updateMultiplier(mult);
                    });
                });

                betInput.addEventListener('input', function() {
                    let val = parseInt(this.value);
                    if (isNaN(val) || val < 1) this.value = 1;
                    updatePotentialWin();
                });

                betInput.addEventListener('change', function() {
                    let val = parseInt(this.value);
                    if (isNaN(val) || val < 1) this.value = 1;
                    updatePotentialWin();
                });

                spinBtn.addEventListener('click', startSpin);
                boostBtn.addEventListener('click', activateBoost);

                window.addEventListener('resize', () => {
                    updateGeometry();
                    drawWheel();
                });
            }

            init();
        })();
    </script>
</body>
</html>
