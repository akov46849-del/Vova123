<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Админ | TANOS STUDIO</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Montserrat',sans-serif;background:#0a0a14;color:#fff;padding:20px;min-height:100vh}
  .container{max-width:800px;margin:0 auto;background:#12122a;padding:30px;border-radius:20px;border:1px solid #ff2e88}
  :root{--pink:#ff2e88;--purple:#8a2be2;--blue:#00d4ff;--gold:#ffd166;--muted:#a0a0c0}
  h1{color:var(--pink);text-align:center;margin-bottom:20px;font-weight:900}
  h2{font-weight:800;margin-bottom:16px}
  h3{margin:20px 0 10px;color:var(--muted);font-size:.85rem;letter-spacing:2px;text-transform:uppercase}
  .status{text-align:center;padding:14px;margin:20px 0;border-radius:12px;font-weight:800;letter-spacing:1px}
  .status.open{background:var(--blue);color:#000}
  .status.closed{background:#333;color:var(--muted)}
  .row{display:flex;justify-content:space-between;align-items:center;padding:14px;border-bottom:1px solid #2a2a3a}
  .name{font-weight:700;font-size:1rem}
  .controls{display:flex;align-items:center;gap:8px}
  .controls button{background:var(--pink);color:#fff;border:none;width:40px;height:40px;border-radius:10px;
    cursor:pointer;font-weight:900;font-size:1.1rem;transition:opacity .2s}
  .controls button.minus{background:var(--purple)}
  .controls button:hover{opacity:.8}
  .count{font-size:1.3rem;font-weight:900;color:var(--gold);min-width:50px;text-align:center}
  input{width:100%;padding:14px;border-radius:12px;border:1px solid #2a2a3a;background:#0a0a14;
    color:#fff;margin-bottom:12px;font-family:inherit;font-size:1rem}
  .btn{background:linear-gradient(90deg,var(--pink),var(--purple));color:#fff;border:none;padding:16px;
    border-radius:12px;font-weight:800;cursor:pointer;width:100%;font-size:1rem;letter-spacing:1px}
  .btn:hover{opacity:.9}
  .btn-ghost{background:#2a2a3a;width:auto;padding:10px 20px;font-size:.85rem}
  .header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
  .error{color:var(--pink);margin-top:10px;text-align:center}
  #admin{display:none}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:10px;flex-wrap:wrap}
  .top .email{font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<div class="container">
  <h1>TANOS ADMIN</h1>

  <div id="login">
    <h2>Вход</h2>
    <input type="email" id="email" placeholder="Email" autocomplete="username" value="yakovzhovtyuk@yandex.ru">
    <input type="password" id="pass" placeholder="Пароль" autocomplete="current-password">
    <button class="btn" onclick="login()">Войти</button>
    <p id="err" class="error"></p>
  </div>

  <div id="admin">
    <div class="top">
      <div>
        <div class="email" id="who"></div>
      </div>
      <button class="btn btn-ghost" onclick="logout()">Выйти</button>
    </div>

    <div id="status" class="status closed">Статус: загрузка...</div>
    <button id="toggle" class="btn" onclick="toggle()" style="margin-bottom:10px">Открыть голосование</button>

    <h3>Голоса</h3>
    <div id="list"></div>
  </div>
</div>

<script>
  const API = 'https://evrovision.akov46849.workers.dev';
  let token = localStorage.getItem('admin_token') || '';
  let email = localStorage.getItem('admin_email') || '';

  const ARTISTS = [
    {id:'basta', name:'🇷🇺 Баста'},
    {id:'dara', name:'🇧🇬 DARA'},
    {id:'lady_gaga', name:'🇺🇸 Lady Gaga'},
    {id:'ed_sheeran', name:'🇬🇧 Ed Sheeran'},
    {id:'the_weeknd', name:'🇨🇦 The Weeknd'},
    {id:'indila', name:'🇫🇷 Indila'},
    {id:'rammstein', name:'🇩🇪 Rammstein'},
    {id:'rosalia', name:'🇪🇸 Rosalía'},
    {id:'eros', name:'🇮🇹 Eros Ramazzotti'},
    {id:'zara', name:'🇸🇪 Zara Larsson'},
    {id:'alan_walker', name:'🇳🇴 Alan Walker'},
    {id:'garrix', name:'🇳🇱 Martin Garrix'},
    {id:'sia', name:'🇦🇺 Sia'},
    {id:'bts', name:'🇰🇷 BTS'},
    {id:'shakira', name:'🇨🇴 Shakira'},
    {id:'rema', name:'🇳🇬 Rema'},
    {id:'bad_bunny', name:'🇵🇷 Bad Bunny'}
  ];

  function showScreen() {
    document.getElementById('login').style.display = token ? 'none' : 'block';
    document.getElementById('admin').style.display = token ? 'block' : 'none';
    document.getElementById('who').textContent = email ? 'Вошёл: ' + email : '';
    if (token) refresh();
  }

  async function login() {
    const emailVal = document.getElementById('email').value.trim();
    const passVal = document.getElementById('pass').value;
    const err = document.getElementById('err');
    err.textContent = '';
    try {
      const r = await fetch(API + '/login', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({email: emailVal, password: passVal})
      });
      const d = await r.json();
      if (!r.ok) { err.textContent = d.error || 'Ошибка входа'; return; }
      token = d.token; email = d.email;
      localStorage.setItem('admin_token', token);
      localStorage.setItem('admin_email', email);
      showScreen();
    } catch (e) { err.textContent = 'Нет связи с сервером'; }
  }

  function logout() {
    token = ''; email = '';
    localStorage.removeItem('admin_token');
    localStorage.removeItem('admin_email');
    showScreen();
  }

  async function refresh() {
    try {
      const [sR, rR] = await Promise.all([
        fetch(API + '/status'), fetch(API + '/results')
      ]);
      const s = await sR.json();
      const r = await rR.json();
      const results = r.results || {};
      const st = document.getElementById('status');
      const btn = document.getElementById('toggle');
      if (s.isOpen) {
        st.textContent = '🟢 ГОЛОСОВАНИЕ ОТКРЫТО';
        st.className = 'status open';
        btn.textContent = 'ЗАКРЫТЬ ГОЛОСОВАНИЕ';
      } else {
        st.textContent = '🔴 ГОЛОСОВАНИЕ ЗАКРЫТО';
        st.className = 'status closed';
        btn.textContent = 'ОТКРЫТЬ ГОЛОСОВАНИЕ';
      }
      renderList(results);
    } catch (e) {
      document.getElementById('status').textContent = 'Ошибка связи';
    }
  }

  function renderList(results) {
    const list = document.getElementById('list');
    list.innerHTML = '';
    ARTISTS.forEach(a => {
      const v = results[a.id] || 0;
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `
        <span class="name">${a.name}</span>
        <div class="controls">
          <button class="minus" onclick="adjust('${a.id}', -1)">−</button>
          <span class="count" id="c-${a.id}">${v}</span>
          <button onclick="adjust('${a.id}', 1)">+</button>
        </div>`;
      list.appendChild(row);
    });
  }

  async function adjust(artistId, delta) {
    try {
      const r = await fetch(API + '/admin/adjust', {
        method: 'POST',
        headers: {
          'Content-Type':'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({artistId, delta})
      });
      const d = await r.json();
      if (!r.ok) return alert(d.error || 'Ошибка');
      const el = document.getElementById('c-' + artistId);
      if (el) el.textContent = d.newVotes;
    } catch (e) { alert('Ошибка сети'); }
  }

  async function toggle() {
    try {
      const r = await fetch(API + '/admin/toggle', {
        method: 'POST',
        headers: {'Authorization': 'Bearer ' + token}
      });
      const d = await r.json();
      if (!r.ok) return alert(d.error || 'Ошибка');
      refresh();
    } catch (e) { alert('Ошибка сети'); }
  }

  showScreen();
  setInterval(() => { if (token) refresh(); }, 5000);
</script>
</body>
</html>
