<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Казино Арты — Колесо</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Russo+One&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        /* частицы фона (упрощённо) */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, #1a0f0a, #0a0a0f 70%);
            z-index: -2;
        }
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,215,0,0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,215,0,0.2), transparent),
                radial-gradient(3px 3px at 60% 20%, rgba(255,215,0,0.4), transparent),
                radial-gradient(2px 2px at 80% 60%, rgba(255,215,0,0.2), transparent),
                radial-gradient(2px 2px at 10% 90%, rgba(255,215,0,0.3), transparent),
                radial-gradient(2px 2px at 90% 10%, rgba(255,215,0,0.3), transparent);
            background-size: 200% 200%;
            animation: twinkle 8s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .container {
            max-width: 900px;
            width: 95%;
            margin: 20px auto;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 40px;
            padding: 25px 30px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            margin-bottom: 25px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ff6a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }
        .logo i {
            -webkit-text-fill-color: initial;
            color: #ffd700;
            margin-right: 8px;
        }
        .balance-box {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            padding: 8px 22px;
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .balance-box i {
            color: #ffd700;
        }
        .balance-box span {
            color: #ffd700;
        }

        /* Основная область */
        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 550px;
            margin: 0 auto 30px;
        }
        canvas#wheelCanvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2), 0 0 100px rgba(255, 215, 0, 0.05);
        }
        /* Стрелка */
        .arrow {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3.5rem;
            color: #ffd700;
            filter: drop-shadow(0 0 15px rgba(255,215,0,0.8));
            z-index: 10;
            text-shadow: 0 0 20px #ffd700;
            line-height: 1;
            pointer-events: none;
        }
        .arrow::before {
            content: '▼';
            display: block;
        }

        /* Панель управления */
        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 10px 0 15px;
            width: 100%;
        }
        .bet-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 5px 18px 5px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .bet-group label {
            font-size: 0.9rem;
            color: #aaa;
        }
        .bet-group input {
            background: transparent;
            border: none;
            color: #ffd700;
            font-size: 1.2rem;
            font-weight: 700;
            width: 80px;
            font-family: 'Orbitron', sans-serif;
            outline: none;
            text-align: center;
        }
        .bet-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .bet-group input:focus {
            border-bottom: 1px solid #ffd700;
        }

        .spin-btn {
            background: linear-gradient(145deg, #ffd700, #ff8c00);
            border: none;
            color: #0a0a0f;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 12px 40px;
            border-radius: 40px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .spin-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }
        .spin-btn:disabled {
            opacity: 0.5;
            transform: scale(0.98);
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-box {
            text-align: center;
            min-height: 60px;
            font-size: 1.2rem;
            padding: 10px;
            color: #ddd;
            font-family: 'Segoe UI', sans-serif;
            background: rgba(255, 215, 0, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            width: 100%;
            max-width: 500px;
            margin-top: 5px;
        }
        .result-box .win {
            color: #ffd700;
            font-weight: 700;
        }
        .result-box .lose {
            color: #ff4466;
            font-weight: 700;
        }
        .result-box .multiplier {
            color: #ffaa00;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #555;
            font-size: 0.7rem;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 215, 0, 0.05);
            padding-top: 20px;
        }
        .footer span {
            color: #ffd700;
        }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .logo { font-size: 1.3rem; }
            .balance-box { font-size: 1rem; padding: 6px 16px; }
            .controls { gap: 12px; }
            .spin-btn { padding: 10px 28px; font-size: 1rem; }
            .bet-group input { width: 60px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="particles"></div>
    <div class="container">
        <header class="header">
            <div class="logo"><i class="fas fa-bolt"></i> АРТА КАЗИНО</div>
            <div class="balance-box">
                <i class="fas fa-coins"></i> Баланс: <span id="balanceDisplay">10000</span>
            </div>
        </header>

        <div class="game-area">
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="600" height="600"></canvas>
                <div class="arrow"></div>
            </div>

            <div class="controls">
                <div class="bet-group">
                    <label><i class="fas fa-gem"></i> Ставка</label>
                    <input type="number" id="betInput" value="50" min="1" step="1" />
                </div>
                <button class="spin-btn" id="spinBtn"><i class="fas fa-sync-alt"></i> КРУТИТЬ</button>
            </div>

            <div class="result-box" id="resultBox">
                <span id="resultText">Нажми «Крутить», чтобы начать</span>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 <span>Арта</span> — удача на твоей стороне. Играй ответственно (всё понарошку).</p>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script>
        (function(){
            // ---------- Конфигурация секторов ----------
            const sectors = [
                { label: 'x0',   multiplier: 0,  weight: 40, color: '#2a2a3a' },
                { label: 'x2',   multiplier: 2,  weight: 30, color: '#3a5a7a' },
                { label: 'x3',   multiplier: 3,  weight: 15, color: '#4a8a5a' },
                { label: 'x5',   multiplier: 5,  weight: 8,  color: '#a87a3a' },
                { label: 'x10',  multiplier: 10, weight: 5,  color: '#a05a6a' },
                { label: 'x20',  multiplier: 20, weight: 2,  color: '#7a3a8a' },
                { label: 'x50',  multiplier: 50, weight: 1,  color: '#d4af37' }
            ];

            // Расчёт угловых интервалов
            const totalWeight = sectors.reduce((sum, s) => sum + s.weight, 0);
            let startAngle = 0;
            const sectorAngles = sectors.map(s => {
                const angle = (s.weight / totalWeight) * 2 * Math.PI;
                const obj = { ...s, start: startAngle, end: startAngle + angle };
                startAngle += angle;
                return obj;
            });

            // ---------- Canvas ----------
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.42;

            // ---------- Состояние ----------
            let balance = 10000;
            let currentAngle = 0;           // текущий поворот колеса (рад)
            let isSpinning = false;
            let animationId = null;
            let spinStartTime = 0;
            const SPIN_DURATION = 20000;    // 20 секунд

            // DOM
            const balanceDisplay = document.getElementById('balanceDisplay');
            const betInput = document.getElementById('betInput');
            const spinBtn = document.getElementById('spinBtn');
            const resultText = document.getElementById('resultText');

            // ---------- Отрисовка колеса ----------
            function drawWheel(rotation) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                // Тень
                ctx.shadowColor = 'rgba(255,215,0,0.15)';
                ctx.shadowBlur = 30;

                const angles = sectorAngles.map(s => ({ start: s.start + rotation, end: s.end + rotation, color: s.color, label: s.label, multiplier: s.multiplier }));

                angles.forEach(seg => {
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, seg.start, seg.end);
                    ctx.closePath();
                    ctx.fillStyle = seg.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,215,0,0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.shadowBlur = 30;

                    // Текст
                    const midAngle = (seg.start + seg.end) / 2;
                    const textRadius = radius * 0.7;
                    const x = centerX + Math.cos(midAngle) * textRadius;
                    const y = centerY + Math.sin(midAngle) * textRadius;
                    ctx.save();
                    ctx.translate(x, y);
                    ctx.rotate(midAngle + (midAngle > Math.PI/2 ? Math.PI : 0));
                    ctx.font = 'bold 18px Orbitron, sans-serif';
                    ctx.fillStyle = '#fff';
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(seg.label, 0, 0);
                    ctx.restore();
                });

                // Внешний обод
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(255,215,0,0.4)';
                ctx.lineWidth = 6;
                ctx.stroke();
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(255,215,0,0.1)';

                // Центр
                ctx.beginPath();
                ctx.arc(centerX, centerY, 18, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(255,215,0,0.6)';
                ctx.fill();

                ctx.shadowBlur = 0;
            }

            // ---------- Получение сектора по углу (с учётом вращения) ----------
            function getSectorAtAngle(rotation) {
                // Стрелка сверху (угол -PI/2)
                const pointerAngle = -Math.PI / 2;
                // Угол на колесе, соответствующий стрелке: rotation + pointerAngle? 
                // Так как мы рисуем сектора от rotation, то фактический угол в пространстве сектора = (pointerAngle - rotation) normalized
                let raw = (pointerAngle - rotation) % (2 * Math.PI);
                if (raw < 0) raw += 2 * Math.PI;
                // Ищем сектор, содержащий raw
                for (let s of sectorAngles) {
                    if (raw >= s.start && raw < s.end) {
                        return s;
                    }
                }
                // fallback (если из-за погрешности)
                return sectorAngles[0];
            }

            // ---------- Анимация вращения ----------
            function startSpin() {
                if (isSpinning) return;
                const bet = parseInt(betInput.value);
                if (isNaN(bet) || bet <= 0) {
                    resultText.innerHTML = '⚠️ Введите корректную ставку';
                    return;
                }
                if (bet > balance) {
                    resultText.innerHTML = '⚠️ Недостаточно средств!';
                    return;
                }

                // Списываем ставку
                balance -= bet;
                updateBalance();

                // Блокируем кнопку
                isSpinning = true;
                spinBtn.disabled = true;
                resultText.innerHTML = '🌀 Колесо крутится... подождите 20 секунд';

                // Случайная начальная скорость (рад/сек) + несколько оборотов
                const initialSpeed = 6 + Math.random() * 4; // 6-10 рад/с
                // Рассчитываем замедление так, чтобы через 20 сек скорость стала 0
                const deceleration = initialSpeed / (SPIN_DURATION / 1000); // рад/с^2

                let speed = initialSpeed;
                let angle = currentAngle;
                const startTime = performance.now();

                // Дополнительный случайный поворот (до 5 оборотов)
                const extraRotation = Math.random() * 10 * Math.PI; 
                angle += extraRotation;

                function animate(timestamp) {
                    const elapsed = timestamp - startTime; // мс
                    if (elapsed >= SPIN_DURATION) {
                        // Остановка
                        angle += speed * (SPIN_DURATION / 1000 - (SPIN_DURATION / 1000) * (SPIN_DURATION / 1000) / 2); // интеграл
                        speed = 0;
                        currentAngle = angle;
                        drawWheel(currentAngle);
                        // Определяем результат
                        const sector = getSectorAtAngle(currentAngle);
                        const multiplier = sector.multiplier;
                        const winAmount = bet * multiplier;
                        let message = '';
                        if (multiplier === 0) {
                            message = `💔 Проигрыш! Выпал ${sector.label}. Ставка сгорела.`;
                            resultText.innerHTML = `<span class="lose">${message}</span>`;
                        } else {
                            balance += winAmount;
                            updateBalance();
                            message = `🎉 Выигрыш! x${multiplier} = ${winAmount} денег! (сектор ${sector.label})`;
                            resultText.innerHTML = `<span class="win">${message}</span>`;
                        }
                        isSpinning = false;
                        spinBtn.disabled = false;
                        return;
                    }

                    // Обновляем скорость и угол (физика с замедлением)
                    const dt = Math.min(16, elapsed - (animation.prevTime || startTime)); // примерный dt
                    animation.prevTime = elapsed;
                    // Применяем замедление
                    speed -= deceleration * (dt / 1000);
                    if (speed < 0) speed = 0;
                    angle += speed * (dt / 1000);

                    // Сохраняем текущий угол
                    currentAngle = angle;
                    drawWheel(currentAngle);
                    requestAnimationFrame(animate);
                }

                animationId = requestAnimationFrame(animate);
                // Сохраняем prevTime
                animate.prevTime = null;
            }

            // ---------- Обновление баланса ----------
            function updateBalance() {
                balanceDisplay.textContent = balance;
            }

            // ---------- Инициализация ----------
            function init() {
                drawWheel(0);
                updateBalance();
                spinBtn.addEventListener('click', startSpin);
                // Защита от ввода отрицательных и текста
                betInput.addEventListener('change', function() {
                    let val = parseInt(this.value);
                    if (isNaN(val) || val < 1) this.value = 1;
                });
            }

            init();

            // Дополнительно: перерисовка при изменении размера окна (не требуется, так как canvas фиксирован)
            // Обработка ошибок
            window.addEventListener('resize', () => { drawWheel(currentAngle); });
        })();
    </script>
</body>
</html>
