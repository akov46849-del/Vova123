<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Казино Арты — Колесо</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Russo+One&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0a0f;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, #1a0f0a, #0a0a0f 70%);
            z-index: -2;
        }
        .particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, rgba(255,215,0,0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255,215,0,0.2), transparent),
                radial-gradient(3px 3px at 60% 20%, rgba(255,215,0,0.4), transparent),
                radial-gradient(2px 2px at 80% 60%, rgba(255,215,0,0.2), transparent),
                radial-gradient(2px 2px at 10% 90%, rgba(255,215,0,0.3), transparent),
                radial-gradient(2px 2px at 90% 10%, rgba(255,215,0,0.3), transparent);
            background-size: 200% 200%;
            animation: twinkle 8s ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .container {
            max-width: 900px;
            width: 95%;
            margin: 20px auto;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 40px;
            padding: 25px 30px 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
            margin-bottom: 25px;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(45deg, #ffd700, #ff6a00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 3px;
        }
        .logo i {
            -webkit-text-fill-color: initial;
            color: #ffd700;
            margin-right: 8px;
        }
        .balance-box {
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 30px;
            padding: 8px 22px;
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .balance-box i {
            color: #ffd700;
        }
        .balance-box span {
            color: #ffd700;
        }

        .game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .wheel-wrapper {
            position: relative;
            width: 100%;
            max-width: 550px;
            margin: 0 auto 20px;
        }
        canvas#wheelCanvas {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2), 0 0 100px rgba(255, 215, 0, 0.05);
        }

        /* Панель выбора множителя */
        .multiplier-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin: 10px 0 20px;
            width: 100%;
        }
        .multiplier-btn {
            background: transparent;
            border: 2px solid rgba(255, 215, 0, 0.2);
            color: #aaa;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 8px 20px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }
        .multiplier-btn:hover {
            border-color: rgba(255, 215, 0, 0.5);
            color: #fff;
        }
        .multiplier-btn.active {
            border-color: #ffd700;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 10px 0 15px;
            width: 100%;
        }
        .bet-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.03);
            padding: 5px 18px 5px 22px;
            border-radius: 40px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .bet-group label {
            font-size: 0.9rem;
            color: #aaa;
        }
        .bet-group input {
            background: transparent;
            border: none;
            color: #ffd700;
            font-size: 1.2rem;
            font-weight: 700;
            width: 80px;
            font-family: 'Orbitron', sans-serif;
            outline: none;
            text-align: center;
        }
        .bet-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
        }
        .bet-group input:focus {
            border-bottom: 1px solid #ffd700;
        }

        .spin-btn {
            background: linear-gradient(145deg, #ffd700, #ff8c00);
            border: none;
            color: #0a0a0f;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.2rem;
            padding: 12px 40px;
            border-radius: 40px;
            cursor: pointer;
            letter-spacing: 2px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .spin-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }
        .spin-btn:disabled {
            opacity: 0.5;
            transform: scale(0.98);
            cursor: not-allowed;
            box-shadow: none;
        }

        .result-box {
            text-align: center;
            min-height: 70px;
            font-size: 1.1rem;
            padding: 12px;
            color: #ddd;
            font-family: 'Segoe UI', sans-serif;
            background: rgba(255, 215, 0, 0.03);
            border-radius: 20px;
            border: 1px solid rgba(255, 215, 0, 0.05);
            width: 100%;
            max-width: 500px;
            margin-top: 5px;
        }
        .result-box .win {
            color: #ffd700;
            font-weight: 700;
        }
        .result-box .lose {
            color: #ff4466;
            font-weight: 700;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #555;
            font-size: 0.7rem;
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 215, 0, 0.05);
            padding-top: 20px;
        }
        .footer span {
            color: #ffd700;
        }

        @media (max-width: 600px) {
            .container { padding: 15px; }
            .logo { font-size: 1.3rem; }
            .balance-box { font-size: 1rem; padding: 6px 16px; }
            .controls { gap: 12px; }
            .spin-btn { padding: 10px 28px; font-size: 1rem; }
            .bet-group input { width: 60px; font-size: 1rem; }
            .multiplier-btn { font-size: 0.8rem; padding: 6px 14px; }
        }
    </style>
</head>
<body>
    <div class="particles"></div>
    <div class="container">
        <header class="header">
            <div class="logo"><i class="fas fa-bolt"></i> АРТА КАЗИНО</div>
            <div class="balance-box">
                <i class="fas fa-coins"></i> Баланс: <span id="balanceDisplay">10000</span>
            </div>
        </header>

        <div class="game-area">
            <div class="wheel-wrapper">
                <canvas id="wheelCanvas" width="600" height="600"></canvas>
            </div>

            <!-- Выбор множителя -->
            <div class="multiplier-selector" id="multiplierSelector">
                <button class="multiplier-btn active" data-mult="2">x2</button>
                <button class="multiplier-btn" data-mult="3">x3</button>
                <button class="multiplier-btn" data-mult="5">x5</button>
                <button class="multiplier-btn" data-mult="10">x10</button>
                <button class="multiplier-btn" data-mult="20">x20</button>
                <button class="multiplier-btn" data-mult="50">x50</button>
            </div>

            <div class="controls">
                <div class="bet-group">
                    <label><i class="fas fa-gem"></i> Ставка</label>
                    <input type="number" id="betInput" value="50" min="1" step="1" />
                </div>
                <button class="spin-btn" id="spinBtn"><i class="fas fa-sync-alt"></i> КРУТИТЬ</button>
            </div>

            <div class="result-box" id="resultBox">
                <span id="resultText">Выберите множитель и нажмите «Крутить»</span>
            </div>
        </div>

        <div class="footer">
            <p>© 2026 <span>Арта</span> — удача на твоей стороне. Играй ответственно (всё понарошку).</p>
        </div>
    </div>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script>
        (function() {
            // ---------- Конфигурация ----------
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(canvas.width, canvas.height) * 0.42;

            // Состояние
            let balance = 10000;
            let currentAngle = 0;          // угол стрелки (направление острия)
            let isSpinning = false;
            let animationId = null;

            // Текущий выбранный множитель
            let selectedMultiplier = 2;
            // Углы секторов (в радианах)
            let zeroStart = 0;    // начало сектора x0
            let zeroEnd = 0;      // конец сектора x0
            let multStart = 0;    // начало сектора множителя
            let multEnd = 0;      // конец сектора множителя

            // DOM
            const balanceDisplay = document.getElementById('balanceDisplay');
            const betInput = document.getElementById('betInput');
            const spinBtn = document.getElementById('spinBtn');
            const resultText = document.getElementById('resultText');
            const multiplierBtns = document.querySelectorAll('.multiplier-btn');

            // ---------- Вспомогательные функции ----------
            function normalizeAngle(angle) {
                angle = angle % (2 * Math.PI);
                if (angle < 0) angle += 2 * Math.PI;
                return angle;
            }

            // ---------- Расчёт углов секторов ----------
            function updateAngles(mult) {
                // Угол сектора множителя = 2*PI / mult (чем больше mult, тем меньше сектор)
                const multAngle = (2 * Math.PI) / mult;
                const zeroAngle = 2 * Math.PI - multAngle;

                // Располагаем сектор x0 сверху (центр в -PI/2)
                const centerZero = -Math.PI / 2;
                zeroStart = centerZero - zeroAngle / 2;
                zeroEnd = centerZero + zeroAngle / 2;

                // Сектор множителя — всё остальное
                multStart = zeroEnd;
                multEnd = zeroStart + 2 * Math.PI; // с учётом wrap-around
            }

            // ---------- Отрисовка колеса ----------
            function drawWheel() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.shadowColor = 'rgba(255,215,0,0.15)';
                ctx.shadowBlur = 30;

                // Рисуем сектор x0
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                // Дуга от zeroStart до zeroEnd
                ctx.arc(centerX, centerY, radius, zeroStart, zeroEnd);
                ctx.closePath();
                ctx.fillStyle = '#2a2a3a';
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = 'rgba(255,215,0,0.2)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.shadowBlur = 30;

                // Текст x0
                const midZero = (zeroStart + zeroEnd) / 2;
                const textR = radius * 0.7;
                const x0 = centerX + Math.cos(midZero) * textR;
                const y0 = centerY + Math.sin(midZero) * textR;
                ctx.save();
                ctx.translate(x0, y0);
                ctx.rotate(midZero + (midZero > Math.PI/2 ? Math.PI : 0));
                ctx.font = 'bold 20px Orbitron, sans-serif';
                ctx.fillStyle = '#fff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('x0', 0, 0);
                ctx.restore();

                // Рисуем сектор множителя (от multStart до multEnd с учётом, что это может быть > 2*PI)
                // Так как multEnd может быть больше 2*PI, разобьём на две дуги, если нужно
                if (multEnd > 2 * Math.PI) {
                    // первая часть от multStart до 2*PI
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, multStart, 2 * Math.PI);
                    ctx.closePath();
                    ctx.fillStyle = '#3a7a5a';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,215,0,0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.shadowBlur = 30;

                    // вторая часть от 0 до multEnd - 2*PI
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, 0, multEnd - 2 * Math.PI);
                    ctx.closePath();
                    ctx.fillStyle = '#3a7a5a';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,215,0,0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.shadowBlur = 30;
                } else {
                    ctx.beginPath();
                    ctx.moveTo(centerX, centerY);
                    ctx.arc(centerX, centerY, radius, multStart, multEnd);
                    ctx.closePath();
                    ctx.fillStyle = '#3a7a5a';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.strokeStyle = 'rgba(255,215,0,0.2)';
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.shadowBlur = 30;
                }

                // Текст множителя (рисуем в центре сектора множителя)
                // Найдём середину углового интервала множителя
                let midMult;
                if (multEnd > 2 * Math.PI) {
                    const totalMultAngle = (2 * Math.PI - multStart) + (multEnd - 2 * Math.PI);
                    midMult = multStart + totalMultAngle / 2;
                    if (midMult > 2 * Math.PI) midMult -= 2 * Math.PI;
                } else {
                    midMult = (multStart + multEnd) / 2;
                }
                const xm = centerX + Math.cos(midMult) * textR;
                const ym = centerY + Math.sin(midMult) * textR;
                ctx.save();
                ctx.translate(xm, ym);
                ctx.rotate(midMult + (midMult > Math.PI/2 ? Math.PI : 0));
                ctx.font = 'bold 20px Orbitron, sans-serif';
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 10;
                ctx.shadowColor = 'rgba(0,0,0,0.8)';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('x' + selectedMultiplier, 0, 0);
                ctx.restore();

                // Внешний обод
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                ctx.strokeStyle = 'rgba(255,215,0,0.4)';
                ctx.lineWidth = 6;
                ctx.stroke();
                ctx.shadowBlur = 30;
                ctx.shadowColor = 'rgba(255,215,0,0.1)';

                // Центр
                ctx.beginPath();
                ctx.arc(centerX, centerY, 18, 0, 2 * Math.PI);
                ctx.fillStyle = '#ffd700';
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'rgba(255,215,0,0.6)';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // ---------- Отрисовка стрелки ----------
            function drawArrow(angle) {
                const arrowLength = radius * 0.2;
                const baseWidth = 18;
                const tipOffset = 6; // чтобы остриё было чуть дальше обода

                // Вычисляем координаты острия
                const tipX = centerX + (radius + tipOffset) * Math.cos(angle);
                const tipY = centerY + (radius + tipOffset) * Math.sin(angle);

                // Основание стрелки (две точки на расстоянии arrowLength от острия назад)
                const backX = centerX + (radius + tipOffset - arrowLength) * Math.cos(angle);
                const backY = centerY + (radius + tipOffset - arrowLength) * Math.sin(angle);

                // Перпендикуляр к направлению
                const perpX = -Math.sin(angle);
                const perpY = Math.cos(angle);

                const p1x = backX + baseWidth/2 * perpX;
                const p1y = backY + baseWidth/2 * perpY;
                const p2x = backX - baseWidth/2 * perpX;
                const p2y = backY - baseWidth/2 * perpY;

                ctx.save();
                ctx.beginPath();
                ctx.moveTo(tipX, tipY);
                ctx.lineTo(p1x, p1y);
                ctx.lineTo(p2x, p2y);
                ctx.closePath();

                ctx.fillStyle = '#ffd700';
                ctx.shadowColor = 'rgba(255,215,0,0.9)';
                ctx.shadowBlur = 25;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }

            // ---------- Определение сектора по углу стрелки ----------
            function getSector(angle) {
                let raw = normalizeAngle(angle);
                // Проверяем, попадает ли в сектор x0 (с учётом wrap-around)
                // Так как zeroStart может быть отрицательным, нормализуем их
                let start = normalizeAngle(zeroStart);
                let end = normalizeAngle(zeroEnd);
                // Но если zeroStart < 0, то сектор переходит через 0
                // Проще: проверить, принадлежит ли raw интервалу [zeroStart, zeroEnd] без нормализации,
                // но с учётом того, что zeroStart может быть отрицательным, а zeroEnd положительным.
                if (zeroStart < 0) {
                    // Сектор пересекает 0
                    if (raw >= zeroStart + 2 * Math.PI || raw <= zeroEnd) {
                        return 'zero';
                    } else {
                        return 'mult';
                    }
                } else {
                    if (raw >= zeroStart && raw <= zeroEnd) {
                        return 'zero';
                    } else {
                        return 'mult';
                    }
                }
            }

            // ---------- Обновление интерфейса после выбора множителя ----------
            function updateMultiplier(mult) {
                selectedMultiplier = mult;
                updateAngles(mult);
                drawWheel();
                drawArrow(currentAngle);
                updatePotentialWin();
                // Активная кнопка
                multiplierBtns.forEach(btn => {
                    btn.classList.toggle('active', parseInt(btn.dataset.mult) === mult);
                });
            }

            // ---------- Потенциальный выигрыш ----------
            function updatePotentialWin() {
                const bet = parseInt(betInput.value) || 0;
                const win = bet * selectedMultiplier;
                const msg = `Ставка ${bet} × ${selectedMultiplier} = <span class="win">${win}</span> (если выпадет x${selectedMultiplier})`;
                if (!isSpinning) {
                    resultText.innerHTML = msg;
                }
            }

            // ---------- Обновление баланса ----------
            function updateBalance() {
                balanceDisplay.textContent = balance;
            }

            // ---------- Вращение (анимация) ----------
            function startSpin() {
                if (isSpinning) return;
                const bet = parseInt(betInput.value);
                if (isNaN(bet) || bet <= 0) {
                    resultText.innerHTML = '⚠️ Введите корректную ставку';
                    return;
                }
                if (bet > balance) {
                    resultText.innerHTML = '⚠️ Недостаточно средств!';
                    return;
                }

                // Списываем ставку
                balance -= bet;
                updateBalance();

                isSpinning = true;
                spinBtn.disabled = true;
                resultText.innerHTML = '🌀 Стрелка крутится... 7 секунд';

                const duration = 7000;
                const startTime = performance.now();
                const initialSpeed = 8 + Math.random() * 5; // 8-13 рад/с
                const extraRotations = (5 + Math.random() * 5) * 2 * Math.PI;
                let angle = currentAngle + extraRotations;
                let prevTimestamp = startTime;

                function animate(timestamp) {
                    const elapsed = timestamp - startTime;
                    if (elapsed >= duration) {
                        // Финальный угол с учётом замедления
                        const totalAngle = initialSpeed * (duration / 1000) - 0.5 * (initialSpeed / (duration / 1000)) * (duration / 1000) * (duration / 1000);
                        angle += totalAngle;
                        currentAngle = angle;
                        drawWheel();
                        drawArrow(currentAngle);

                        // Определяем результат
                        const sector = getSector(currentAngle);
                        let msg = '';
                        if (sector === 'zero') {
                            msg = `💔 Проигрыш! Выпал x0. Ставка сгорела.`;
                            resultText.innerHTML = `<span class="lose">${msg}</span>`;
                        } else {
                            const winAmount = bet * selectedMultiplier;
                            balance += winAmount;
                            updateBalance();
                            msg = `🎉 Выигрыш! x${selectedMultiplier} = ${winAmount} денег!`;
                            resultText.innerHTML = `<span class="win">${msg}</span>`;
                        }
                        isSpinning = false;
                        spinBtn.disabled = false;
                        return;
                    }

                    const dt = Math.min(32, timestamp - prevTimestamp);
                    prevTimestamp = timestamp;

                    const progress = elapsed / duration;
                    const speed = initialSpeed * (1 - progress);
                    angle += speed * (dt / 1000);

                    currentAngle = angle;
                    drawWheel();
                    drawArrow(currentAngle);

                    animationId = requestAnimationFrame(animate);
                }

                animationId = requestAnimationFrame(animate);
            }

            // ---------- Инициализация ----------
            function init() {
                // Устанавливаем начальный множитель
                updateMultiplier(2);
                drawArrow(0);
                updateBalance();
                updatePotentialWin();

                // Обработчики для кнопок множителя
                multiplierBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (isSpinning) return;
                        const mult = parseInt(this.dataset.mult);
                        updateMultiplier(mult);
                    });
                });

                // Обработчик для ставки (обновляем потенциальный выигрыш)
                betInput.addEventListener('input', updatePotentialWin);
                betInput.addEventListener('change', function() {
                    let val = parseInt(this.value);
                    if (isNaN(val) || val < 1) this.value = 1;
                    updatePotentialWin();
                });

                // Кнопка "Крутить"
                spinBtn.addEventListener('click', startSpin);
            }

            init();

            // Перерисовка при изменении размера окна
            window.addEventListener('resize', () => {
                drawWheel();
                drawArrow(currentAngle);
            });
        })();
    </script>
</body>
</html>
