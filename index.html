<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Голосование | Евровидение Roblox 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
  /* Стили оставляем без изменений (они уже отлично выглядят) */
  :root {
    --bg: #06060c; --pink: #ff2e88; --purple: #8a2be2; --blue: #00d4ff; --gold: #ffd166;
    --silver: #e0e0e0; --bronze: #cd7f32; --green: #00ff88; --red: #ff3366;
    --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Montserrat', sans-serif; background-color: var(--bg); color: #fff; min-height: 100vh;
    background-image: radial-gradient(circle at 15% 20%, rgba(138, 43, 226, 0.15), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(255, 46, 136, 0.15), transparent 40%);
    background-attachment: fixed; padding-bottom: 60px; overflow-x: hidden;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 30px 20px; }
  .live-ticker {
    background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0, 212, 255, 0.3); border-radius: 8px;
    padding: 8px 16px; font-size: 0.8rem; color: var(--blue); text-align: center; margin-bottom: 25px;
    overflow: hidden; white-space: nowrap; display: flex; align-items: center; justify-content: center;
    gap: 10px; opacity: 0; transition: opacity 0.5s ease;
  }
  .live-ticker.show { opacity: 1; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); animation: pulse 1.5s infinite; }
  .header { text-align: center; margin-bottom: 40px; }
  h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 900; line-height: 1.1; margin-bottom: 10px;
    background: linear-gradient(90deg, #fff, #a0a0c0); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .total-votes { font-size: 0.9rem; color: #a0a0c0; margin-bottom: 20px; }
  .total-votes span { color: #fff; font-weight: 900; font-size: 1.2rem; }
  .status-banner { display: inline-flex; align-items: center; gap: 10px; padding: 12px 24px; border-radius: 12px;
    font-weight: 800; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; transition: all 0.3s; }
  .status-banner.open { background: rgba(0, 255, 136, 0.1); color: var(--green); border: 1px solid rgba(0, 255, 136, 0.3); box-shadow: 0 0 20px rgba(0, 255, 136, 0.1); }
  .status-banner.closed { background: rgba(255, 51, 102, 0.1); color: var(--red); border: 1px solid rgba(255, 51, 102, 0.3); }
  .leaderboard { display: flex; flex-direction: column; gap: 12px; margin-top: 30px; }
  .row { position: relative; display: flex; align-items: center; background: var(--glass); border: 1px solid var(--border);
    border-radius: 16px; padding: 15px 20px; cursor: pointer; overflow: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(10px); will-change: transform; }
  .row:hover:not(.disabled):not(.voted) { border-color: rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.06);
    transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
  .row.top-1 { border-color: rgba(255, 209, 102, 0.6); box-shadow: 0 0 30px rgba(255, 209, 102, 0.15); background: rgba(255, 209, 102, 0.03); }
  .row.top-2 { border-color: rgba(224, 224, 224, 0.4); }
  .row.top-3 { border-color: rgba(205, 127, 50, 0.4); }
  .progress-bg { position: absolute; top: 0; left: 0; bottom: 0; height: 100%;
    background: linear-gradient(90deg, rgba(138, 43, 226, 0.15), rgba(255, 46, 136, 0.15));
    border-right: 2px solid rgba(255, 46, 136, 0.4); z-index: 0; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); pointer-events: none; }
  .row.top-1 .progress-bg { background: linear-gradient(90deg, rgba(255, 209, 102, 0.05), rgba(255, 209, 102, 0.15)); border-right-color: var(--gold); }
  .row.top-2 .progress-bg { background: linear-gradient(90deg, rgba(224, 224, 224, 0.05), rgba(224, 224, 224, 0.15)); border-right-color: var(--silver); }
  .row.top-3 .progress-bg { background: linear-gradient(90deg, rgba(205, 127, 50, 0.05), rgba(205, 127, 50, 0.15)); border-right-color: var(--bronze); }
  .row-content { position: relative; z-index: 1; display: flex; align-items: center; width: 100%; gap: 15px; }
  .rank-box { display: flex; flex-direction: column; align-items: center; width: 30px; }
  .rank { font-size: 1.1rem; font-weight: 900; color: #666; }
  .row.top-1 .rank { color: var(--gold); font-size: 1.4rem; }
  .row.top-2 .rank { color: var(--silver); font-size: 1.3rem; }
  .row.top-3 .rank { color: var(--bronze); font-size: 1.2rem; }
  .trend { font-size: 0.8rem; font-weight: 900; opacity: 0; transition: opacity 0.3s; margin-top: 2px; }
  .trend.up { color: var(--green); opacity: 1; }
  .trend.down { color: var(--red); opacity: 1; }
  .info { display: flex; align-items: center; gap: 15px; flex: 1; min-width: 0; }
  .flag { font-size: 2rem; line-height: 1; }
  .names { display: flex; flex-direction: column; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .country { font-size: 0.7rem; letter-spacing: 1px; text-transform: uppercase; color: #a0a0c0; }
  .artist { font-size: 1.1rem; font-weight: 800; }
  .stats { display: flex; align-items: center; gap: 15px; text-align: right; }
  .percent { font-size: 0.85rem; font-weight: 800; color: #a0a0c0; min-width: 45px; }
  .votes-count { font-size: 1.4rem; font-weight: 900; color: #fff; min-width: 50px; text-align: right; }
  .vote-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff;
    padding: 10px 18px; border-radius: 10px; font-weight: 800; font-size: 0.75rem; letter-spacing: 1px;
    cursor: pointer; transition: all 0.2s; text-transform: uppercase; display: none; }
  .row:hover:not(.disabled):not(.voted) .vote-btn { display: block; background: linear-gradient(90deg, var(--pink), var(--purple)); border-color: transparent; box-shadow: 0 0 15px rgba(255, 46, 136, 0.4); }
  .row.voted { border-color: rgba(0, 212, 255, 0.5); background: rgba(0, 212, 255, 0.05); cursor: default; }
  .row.voted .vote-btn { display: block; background: var(--blue); border-color: var(--blue); color: #000; }
  .row.disabled { opacity: 0.5; cursor: not-allowed; }
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px);
    display: flex; align-items: center; justify-content: center; z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .modal-overlay.show { opacity: 1; pointer-events: all; }
  .modal { background: #12122a; border: 1px solid var(--purple); border-radius: 24px; padding: 40px; text-align: center;
    max-width: 400px; width: 90%; transform: translateY(20px); transition: transform 0.3s; box-shadow: 0 20px 60px rgba(138, 43, 226, 0.3); }
  .modal-overlay.show .modal { transform: translateY(0); }
  .modal h2 { font-size: 1.8rem; margin-bottom: 10px; background: linear-gradient(90deg, var(--pink), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .modal p { color: #a0a0c0; margin-bottom: 30px; font-size: 0.95rem; }
  .share-btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; background: #0088cc;
    color: #fff; text-decoration: none; padding: 16px 30px; border-radius: 12px; font-weight: 800; font-size: 1rem; transition: transform 0.2s; width: 100%; }
  .share-btn:hover { transform: scale(1.02); }
  .close-btn { margin-top: 15px; background: none; border: none; color: #666; cursor: pointer; font-size: 0.9rem; font-family: inherit; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.5); } }
  @media (max-width: 600px) {
    .row { padding: 12px 15px; } .flag { font-size: 1.6rem; } .artist { font-size: 0.95rem; } .stats { gap: 10px; }
    .votes-count { font-size: 1.2rem; min-width: 35px; } .percent { display: none; } .vote-btn { display: block; padding: 8px 12px; font-size: 0.7rem; } .row:hover:not(.disabled):not(.voted) { transform: none; }
  }
</style>
</head>
<body>
<div class="container">
  <div id="liveTicker" class="live-ticker"><div class="live-dot"></div><span id="liveText">Ожидание новых голосов...</span></div>
  <div class="header">
    <h1>ГОЛОСОВАНИЕ</h1>
    <div class="total-votes">Всего отдано голосов: <span id="totalVotes">0</span></div>
    <div id="statusBanner" class="status-banner closed">Загрузка...</div>
  </div>
  <div class="leaderboard" id="leaderboard"></div>
</div>

<div class="modal-overlay" id="shareModal">
  <div class="modal">
    <h2>Голос учтен! 🎉</h2>
    <p id="shareText">Ты поддержал своего фаворита. Расскажи друзьям!</p>
    <a href="#" id="tgShareBtn" target="_blank" class="share-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0c-6.627 0-12 5.373-12 12s5.373 12 12 12 12-5.373 12-12-5.373-12-12-12zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.223-.548.223l.188-2.85 5.18-4.686c.223-.198-.054-.31-.346-.11l-6.4 4.04-2.77-.86c-.6-.19-.61-.6.127-.89l10.84-4.18c.5-.19.95.11.785.89z"/></svg>
      Поделиться в Telegram
    </a>
    <button class="close-btn" onclick="document.getElementById('shareModal').classList.remove('show')">Закрыть</button>
  </div>
</div>

<script>
  const API = 'https://evrovision.akov46849.workers.dev';
  const votedKey = 'ev_voted_artist';
  const roundKey = 'ev_voted_round';
  const NAMES_CACHE = ['User123', 'RobloxKing', 'MusicLover', 'SuperStar', 'PlayerOne', 'Anon', 'EuroFan', 'DJ_Pro'];

  const ARTISTS = [
    {id:'basta', flag:'🇷🇺', country:'Россия', artist:'Баста'}, {id:'dara', flag:'🇧🇬', country:'Болгария', artist:'DARA'},
    {id:'lady_gaga', flag:'🇺🇸', country:'США', artist:'Lady Gaga'}, {id:'ed_sheeran', flag:'🇬🇧', country:'Великобритания', artist:'Ed Sheeran'},
    {id:'the_weeknd', flag:'🇨🇦', country:'Канада', artist:'The Weeknd'}, {id:'indila', flag:'🇫🇷', country:'Франция', artist:'Indila'},
    {id:'rammstein', flag:'🇩🇪', country:'Германия', artist:'Rammstein'}, {id:'rosalia', flag:'🇪🇸', country:'Испания', artist:'Rosalía'},
    {id:'eros', flag:'🇮🇹', country:'Италия', artist:'Eros Ramazzotti'}, {id:'zara', flag:'🇸🇪', country:'Швеция', artist:'Zara Larsson'},
    {id:'alan_walker', flag:'🇳🇴', country:'Норвегия', artist:'Alan Walker'}, {id:'garrix', flag:'🇳🇱', country:'Нидерланды', artist:'Martin Garrix'},
    {id:'sia', flag:'🇦🇺', country:'Австралия', artist:'Sia'}, {id:'bts', flag:'🇰🇷', country:'Южная Корея', artist:'BTS'},
    {id:'shakira', flag:'🇨🇴', country:'Колумбия', artist:'Shakira'}, {id:'rema', flag:'🇳🇬', country:'Нигерия', artist:'Rema'},
    {id:'bad_bunny', flag:'🇵🇷', country:'Пуэрто-Рико', artist:'Bad Bunny'}
  ];

  let isOpen = false;
  let currentRound = 1;
  let results = {};
  let prevRanks = {};
  let prevVotesTotal = 0;
  let votedId = localStorage.getItem(votedKey);
  let votedRound = localStorage.getItem(roundKey);
  let isFirstLoad = true;

  const board = document.getElementById('leaderboard');
  const statusBanner = document.getElementById('statusBanner');
  const totalVotesEl = document.getElementById('totalVotes');
  const liveTicker = document.getElementById('liveTicker');
  const liveText = document.getElementById('liveText');
  const shareModal = document.getElementById('shareModal');

  function playSound(type) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator(); const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      if (type === 'pop') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(400, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
        osc.start(); osc.stop(ctx.currentTime + 0.1);
      }
    } catch(e) {}
  }

  function showLiveMessage(artistName) {
    const randomUser = NAMES_CACHE[Math.floor(Math.random() * NAMES_CACHE.length)];
    liveText.textContent = `Только что ${randomUser} проголосовал за ${artistName}`;
    liveTicker.classList.add('show');
    setTimeout(() => { liveTicker.classList.remove('show'); }, 5000);
  }

  function render(newResults) {
    const oldPositions = {};
    document.querySelectorAll('.row').forEach(row => { oldPositions[row.dataset.id] = row.getBoundingClientRect().top; });

    const sorted = [...ARTISTS].sort((a, b) => (newResults[b.id] || 0) - (newResults[a.id] || 0));
    const totalVotes = Object.values(newResults).reduce((a, b) => a + b, 0) || 1;
    const maxVotes = Math.max(...Object.values(newResults), 1);

    totalVotesEl.textContent = Object.values(newResults).reduce((a, b) => a + b, 0);
    board.innerHTML = '';
    
    sorted.forEach((artist, index) => {
      const v = newResults[artist.id] || 0;
      const percent = Math.round((v / totalVotes) * 100);
      const progressWidth = (v / maxVotes) * 100;
      const rank = index + 1;
      
      let trendHtml = '';
      if (!isFirstLoad && prevRanks[artist.id]) {
        const diff = prevRanks[artist.id] - rank;
        if (diff > 0) trendHtml = `<div class="trend up" id="trend-${artist.id}">▲</div>`;
        if (diff < 0) trendHtml = `<div class="trend down" id="trend-${artist.id}">▼</div>`;
      }

      const row = document.createElement('div');
      row.className = `row ${rank === 1 ? 'top-1' : rank === 2 ? 'top-2' : rank === 3 ? 'top-3' : ''}`;
      row.dataset.id = artist.id;
      
      if (!isOpen) row.classList.add('disabled');
      if (votedId === artist.id && votedRound == currentRound) row.classList.add('voted');
      if ((votedId && votedRound == currentRound) && votedId !== artist.id) row.classList.add('disabled');

      row.innerHTML = `
        <div class="progress-bg" style="width: ${progressWidth}%"></div>
        <div class="row-content">
          <div class="rank-box"><div class="rank">${rank}</div>${trendHtml}</div>
          <div class="info">
            <div class="flag">${artist.flag}</div>
            <div class="names"><div class="country">${artist.country}</div><div class="artist">${artist.artist}</div></div>
          </div>
          <div class="stats">
            <div class="percent">${percent}%</div>
            <div class="votes-count">${v}</div>
            <div class="vote-btn">${(votedId === artist.id && votedRound == currentRound) ? 'Твой голос' : 'Голос'}</div>
          </div>
        </div>
      `;
      
      if ((!votedId || votedRound != currentRound) && isOpen) row.onclick = () => vote(artist.id, artist.artist);
      board.appendChild(row);
    });

    document.querySelectorAll('.row').forEach(row => {
      const oldTop = oldPositions[row.dataset.id];
      if (oldTop !== undefined) {
        const newTop = row.getBoundingClientRect().top;
        const delta = oldTop - newTop;
        if (delta !== 0) {
          row.style.transform = `translateY(${delta}px)`; row.style.transition = 'none';
          requestAnimationFrame(() => {
            row.style.transition = 'transform 0.6s cubic-bezier(0.4, 0, 0.2, 1)'; row.style.transform = '';
          });
        }
      }
    });

    prevRanks = {}; sorted.forEach((a, i) => prevRanks[a.id] = i + 1);
    setTimeout(() => { document.querySelectorAll('.trend').forEach(el => el.style.opacity = 0); }, 3000);
    isFirstLoad = false;
  }

  async function vote(artistId, artistName) {
    if (!isOpen || (votedId && votedRound == currentRound)) return;
    playSound('pop');

    try {
      const r = await fetch(API + '/vote', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({artistId})
      });
      const d = await r.json();
      if (!r.ok) { alert(d.error || 'Ошибка'); return; }
      
      votedId = artistId;
      votedRound = currentRound;
      localStorage.setItem(votedKey, votedId);
      localStorage.setItem(roundKey, votedRound);
      
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors: ['#ff2e88', '#8a2be2', '#00d4ff', '#ffd166'] });
      
      setTimeout(() => {
        const shareUrl = encodeURIComponent('https://akov46849-del.github.io/Vova123/');
        const shareText = encodeURIComponent(`Я отдал свой голос за ${artistName} на Первом Евровидении в Roblox! Присоединяйся!`);
        document.getElementById('tgShareBtn').href = `https://t.me/share/url?url=${shareUrl}&text=${shareText}`;
        shareModal.classList.add('show');
      }, 800);

      results[artistId] = d.newVotes;
      render(results);
    } catch (e) { console.error(e); }
  }

  async function refresh() {
    try {
      const [sR, rR] = await Promise.all([ fetch(API + '/status'), fetch(API + '/results') ]);
      const s = await sR.json();
      const r = await rR.json();
      
      isOpen = s.isOpen;
      currentRound = s.round;
      
      // Если раунд изменился, сбрасываем локальную блокировку
      if (votedId && votedRound != currentRound) {
        votedId = null;
        localStorage.removeItem(votedKey);
        localStorage.removeItem(roundKey);
      }

      const newResults = r.results || {};
      const totalNow = Object.values(newResults).reduce((a, b) => a + b, 0);
      
      if (!isFirstLoad && totalNow > prevVotesTotal) {
        for (let key in newResults) {
          if ((newResults[key] || 0) > (results[key] || 0)) {
            const found = ARTISTS.find(a => a.id === key);
            if (found) showLiveMessage(found.artist);
            break;
          }
        }
      }
      prevVotesTotal = totalNow;

      if (JSON.stringify(newResults) !== JSON.stringify(results)) {
        results = newResults;
        render(results);
      }

      if (isOpen) {
        statusBanner.textContent = '🟢 Голосование открыто';
        statusBanner.className = 'status-banner open';
      } else {
        statusBanner.textContent = '🔴 Голосование закрыто';
        statusBanner.className = 'status-banner closed';
      }
    } catch (e) { console.error('Poll error', e); }
  }

  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
