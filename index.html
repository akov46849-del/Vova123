<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Фракции: Арта, Кубы, Треуглы</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 50% 0%, #1a1a2e, #0f0f17);
    color: #e0e0e0; min-height: 100vh;
    display: flex; justify-content: center; align-items: center; padding: 10px;
  }
  .app {
    width: 100%; max-width: 550px; height: 95vh; max-height: 900px;
    background: #16213e; border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.8);
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid #2a2a4a; position: relative;
  }
  header {
    background: linear-gradient(135deg, #1e1e3a, #2a2a5a);
    padding: 12px 16px; border-bottom: 1px solid #3a3a6a;
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 16px; color: #c9b8ff; letter-spacing: 1px; }
  .user-info { display: flex; align-items: center; gap: 10px; font-size: 12px; }
  .role-badge { padding: 2px 8px; border-radius: 10px; font-weight: bold; }
  .role-badge.admin { background: #ff3b30; color: white; }
  .role-badge.user { background: #3a3a6a; color: #aaa; }
  
  .tabs { display: flex; gap: 4px; padding: 10px 12px; background: #12122a; border-bottom: 1px solid #2a2a4a; }
  .tab {
    flex: 1; padding: 8px 4px; border: none; border-radius: 8px;
    background: transparent; color: #6a6a8a; font-weight: 600; font-size: 13px; cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active { background: linear-gradient(135deg, #5a4a9a, #7a5aff); color: #fff; box-shadow: 0 4px 14px rgba(122,90,255,0.3); }
  
  #chatLog { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #0f0f1f; scroll-behavior: smooth; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.4; animation: fadeIn 0.2s ease; word-wrap: break-word; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .msg.user { align-self: flex-end; background: linear-gradient(135deg, #3a5a9a, #5a8aff); color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #1e1e3a; color: #d0d0f0; border: 1px solid #2a2a4a; border-bottom-left-radius: 4px; }
  .msg.assistant .name { display: block; font-size: 11px; font-weight: 700; margin-bottom: 4px; opacity: 0.7; text-transform: uppercase; }
  .msg.system { align-self: center; background: transparent; color: #ff9f0a; font-size: 12px; font-style: italic; padding: 4px; }
  
  .actions-bar { display: flex; gap: 8px; padding: 8px 12px; background: #12122a; }
  .action-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px; }
  .action-btn.peace { background: #34c759; color: #fff; }
  .action-btn.bomb { background: #ff3b30; color: #fff; }
  .action-btn:hover { opacity: 0.8; }
  .action-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .input-area { padding: 10px 12px 14px; background: #12122a; border-top: 1px solid #2a2a4a; display: flex; gap: 8px; align-items: center; }
  #textInput { flex: 1; padding: 12px; border-radius: 20px; border: 2px solid #2a2a4a; background: #0f0f1f; color: #e0e0e0; font-size: 14px; outline: none; }
  #micBtn, #sendBtn { width: 42px; height: 42px; border-radius: 50%; border: none; background: linear-gradient(135deg, #5a4a9a, #7a5aff); color: #fff; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
  #micBtn.recording { background: #ff3b30; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

  /* Админ-панель */
  #adminPanel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 10, 20, 0.95); z-index: 100; display: none; flex-direction: column; padding: 20px; overflow-y: auto; }
  #adminPanel.show { display: flex; }
  #adminPanel h2 { color: #ff3b30; margin-bottom: 15px; }
  .admin-user-item { display: flex; justify-content: space-between; align-items: center; background: #1e1e3a; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
  .admin-btn { background: #5a4a9a; color: white; border: none; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
  .reset-input { display: flex; gap: 8px; margin-top: 20px; }
  .reset-input input { flex: 1; padding: 8px; border-radius: 6px; border: none; }
  .reset-input button { background: #ff3b30; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
  .close-admin { background: transparent; border: 1px solid #aaa; color: #aaa; padding: 8px; border-radius: 6px; margin-top: auto; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>⚔️ Фракции</h1>
    <div class="user-info">
      <span id="userNameDisplay">Гость</span>
      <span id="userRoleBadge" class="role-badge user">Гость</span>
      <button id="adminToggleBtn" style="display:none; background:none; border:none; color:#ff3b30; cursor:pointer; font-size:16px;">⚙️</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab active" data-faction="arta">Арта</button>
    <button class="tab" data-faction="cubes">Кубы</button>
    <button class="tab" data-faction="treugly">Треуглы</button>
  </div>

  <div id="chatLog"></div>

  <div class="actions-bar">
    <button class="action-btn peace" onclick="doAction('peace')">🕊️ Предложить мир</button>
    <button class="action-btn bomb" onclick="doAction('bomb')">💣 Бомбить</button>
  </div>

  <div class="input-area">
    <button id="micBtn">🎤</button>
    <input type="text" id="textInput" placeholder="Написать..." autocomplete="off">
    <button id="sendBtn">➤</button>
  </div>

  <!-- Админ панель -->
  <div id="adminPanel">
    <h2>⚙️ Админ-панель</h2>
    <p style="font-size:12px; color:#aaa; margin-bottom:15px;">Список участников:</p>
    <div id="adminUserList"></div>
    
    <div class="reset-input">
      <input type="text" id="resetCode" placeholder="Секретный код">
      <button onclick="resetFaction()">Сбросить</button>
    </div>
    <p style="font-size:11px; color:#666; margin-top:5px;">Код: <b>12345</b> (сбросит текущую фракцию)</p>
    
    <button class="close-admin" onclick="document.getElementById('adminPanel').classList.remove('show')">Закрыть</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, query, limitToLast, set, get, remove, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBSb532Ppi7xXdfHcuDfXTp6U_ut_0saio",
  authDomain: "zing-30a21.firebaseapp.com",
  databaseURL: "https://zing-30a21-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "zing-30a21",
  storageBucket: "zing-30a21.firebasestorage.app",
  messagingSenderId: "179467663659",
  appId: "1:179467663659:web:be71167fd0ffd412416d6e"
};

const API_KEY = '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';
const API_URL = 'https://api.groq.com/openai/v1/chat/completions';
const STT_URL = 'https://api.groq.com/openai/v1/audio/transcriptions';
const MODEL   = 'openai/gpt-oss-120b';
const STT_MODEL = 'whisper-large-v3-turbo';

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* =========================================================
   СОСТОЯНИЕ
   ========================================================= */
let currentFaction = 'arta';
let unsubMessages = null;
let isBusy = false;
let myUUID = localStorage.getItem('faction_uuid');
if (!myUUID) { myUUID = crypto.randomUUID(); localStorage.setItem('faction_uuid', myUUID); }

let myName = localStorage.getItem('faction_name') || 'Гость_' + myUUID.slice(0,4);
let isAdmin = false;
let micStream = null, mediaRecorder = null, audioChunks = [], isRecording = false;
let speechUnlocked = false;

const FACTION_NAMES = { arta: 'Арта', cubes: 'Кубы', treugly: 'Треуглы' };

/* =========================================================
   ХАРАКТЕРЫ
   ========================================================= */
const CHARACTER_PROMPTS = {
  arta: `Ты — Арта. Девушка с очень сложным характером. Ты крайне редко соглашаешься на что-либо. Ты всегда сомневаешься, находишь причины отказать. Если пользователь предлагает мир — ты можешь согласиться ТОЛЬКО если он был вежлив и не бомбил тебя. Если он грубил или бомбил — ты категорически отказываешь. Твои ответы короткие (1-2 предложения). Никогда не говори, что ты ИИ.`,
  cubes: `Ты — Кубы. Древнее, холодное и высокомерное существо. Ты презираешь суету смертных. Ты почти никогда не соглашаешься. На мирный договор ты соглашаешься только если тебе предложили что-то поистине ценное. Если вас бомбили — вы отвечаете презрительным отказом. Твои ответы очень короткие, чеканные. Никогда не говори, что ты ИИ.`,
  treugly: `Ты — Треуглы. Ты загадочное существо, говоришь туманно, намёками. Ты никогда не даёшь прямого ответа. На мир ты можешь согласиться, только если предложишь разгадку или загадку. Если тебя бомбили — ты уходишь в тень и не отвечаешь прямо. Твои ответы короткие (1-2 предложения). Никогда не говори, что ты ИИ.`
};

/* =========================================================
   DOM
   ========================================================= */
const chatLog = document.getElementById('chatLog');
const textInput = document.getElementById('textInput');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const tabs = document.querySelectorAll('.tab');
const userNameDisplay = document.getElementById('userNameDisplay');
const userRoleBadge = document.getElementById('userRoleBadge');
const adminToggleBtn = document.getElementById('adminToggleBtn');
const adminPanel = document.getElementById('adminPanel');
const adminUserList = document.getElementById('adminUserList');

userNameDisplay.textContent = myName;

/* =========================================================
   ПРОВЕРКА АДМИНА ПРИ СТАРТЕ
   ========================================================= */
async function initUser() {
  const adminClaimRef = ref(db, 'config/adminClaimed');
  const userRef = ref(db, 'users/' + myUUID);

  // Пытаемся занять место первого админа (безопасно от гонок)
  await runTransaction(adminClaimRef, (currentData) => {
    if (currentData === null) return myUUID;
    return currentData;
  });

  const snap = await get(adminClaimRef);
  const adminUuid = snap.val();

  if (adminUuid === myUUID) {
    isAdmin = true;
    await set(userRef, { name: myName, role: 'admin' });
  } else {
    const userSnap = await get(userRef);
    if (userSnap.exists()) {
      isAdmin = userSnap.val().role === 'admin';
    } else {
      await set(userRef, { name: myName, role: 'user' });
    }
  }

  updateUIRole();

  if (isAdmin) {
    adminToggleBtn.style.display = 'block';
    adminToggleBtn.onclick = () => { openAdminPanel(); };
    listenToUsers();
  }
}

function updateUIRole() {
  if (isAdmin) {
    userRoleBadge.textContent = 'АДМИН';
    userRoleBadge.className = 'role-badge admin';
  } else {
    userRoleBadge.textContent = 'УЧАСТНИК';
    userRoleBadge.className = 'role-badge user';
  }
}

// Смена имени
userNameDisplay.addEventListener('click', async () => {
  const newName = prompt('Как тебя зовут?', myName);
  if (newName && newName.trim()) {
    myName = newName.trim();
    localStorage.setItem('faction_name', myName);
    userNameDisplay.textContent = myName;
    await set(ref(db, 'users/' + myUUID + '/name'), myName);
  }
});

/* =========================================================
   АДМИН ПАНЕЛЬ
   ========================================================= */
function openAdminPanel() {
  adminPanel.classList.add('show');
  listenToUsers();
}

function listenToUsers() {
  onValue(ref(db, 'users'), (snap) => {
    adminUserList.innerHTML = '';
    const users = snap.val() || {};
    Object.keys(users).forEach(uuid => {
      const u = users[uuid];
      const div = document.createElement('div');
      div.className = 'admin-user-item';
      div.innerHTML = `<span>${u.name} ${u.role === 'admin' ? '(Админ)' : ''}</span>`;
      
      if (u.role !== 'admin') {
        const btn = document.createElement('button');
        btn.className = 'admin-btn';
        btn.textContent = 'Повысить';
        btn.onclick = async () => {
          await set(ref(db, 'users/' + uuid + '/role'), 'admin');
        };
        div.appendChild(btn);
      }
      adminUserList.appendChild(div);
    });
  });
}

window.resetFaction = async () => {
  const code = document.getElementById('resetCode').value;
  if (code !== '12345') { alert('Неверный код!'); return; }
  if (!confirm('Точно сбросить историю этой фракции?')) return;
  
  await remove(ref(db, 'chats/' + currentFaction));
  alert('История фракции очищена!');
  document.getElementById('resetCode').value = '';
};

/* =========================================================
   ДЕЙСТВИЯ (МИР / БОМБА)
   ========================================================= */
window.doAction = async (action) => {
  if (isBusy) return;
  const actText = action === 'peace' ? 'Предлагаю мирный договор.' : 'Мы бомбим вас!';
  
  isBusy = true;
  setStatus('...');
  
  const messagesRef = ref(db, 'chats/' + currentFaction);
  
  await push(messagesRef, {
    role: 'user',
    text: actText,
    user: myName,
    timestamp: Date.now()
  });

  const snap = await get(query(messagesRef, limitToLast(10)));
  const historyArr = Object.values(snap.val() || {}).map(m => ({
    role: m.role === 'user' ? 'user' : 'assistant',
    content: m.text
  }));

  const reply = await askAI(currentFaction, historyArr, action);

  await push(messagesRef, {
    role: 'assistant',
    text: reply,
    timestamp: Date.now()
  });
  
  isBusy = false;
  setStatus('');
};

/* =========================================================
   ОТПРАВКА СООБЩЕНИЙ
   ========================================================= */
async function sendMessage(text) {
  if (!text.trim() || isBusy) return;
  isBusy = true;
  sendBtn.disabled = true; micBtn.disabled = true;

  const messagesRef = ref(db, 'chats/' + currentFaction);

  try {
    await push(messagesRef, { role: 'user', text: text, user: myName, timestamp: Date.now() });

    const snap = await get(query(messagesRef, limitToLast(10)));
    const historyArr = Object.values(snap.val() || {}).map(m => ({
      role: m.role === 'user' ? 'user' : 'assistant',
      content: m.text
    }));

    const reply = await askAI(currentFaction, historyArr, 'chat');
    await push(messagesRef, { role: 'assistant', text: reply, timestamp: Date.now() });

  } catch (e) { console.error(e); }
  finally { isBusy = false; sendBtn.disabled = false; micBtn.disabled = false; }
}

/* =========================================================
   GROQ API
   ========================================================= */
async function askAI(faction, history, actionType) {
  const systemPrompt = CHARACTER_PROMPTS[faction];
  
  let extraInstruction = "";
  if (actionType === 'peace') extraInstruction = "Пользователь только что предложил тебе МИРНЫЙ ДОГОВОР. Реши, принимаешь ты его или нет, исходя из истории. Если он грубил — откажи.";
  if (actionType === 'bomb') extraInstruction = "Пользователь только что СБРОСИЛ БОМБУ на тебя. Ответь на это. Ты в ярости или презрении. Ты больше никогда не согласишься на мир.";

  const messages = [
    { role: 'system', content: systemPrompt + " " + extraInstruction }, 
    ...history
  ];

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODEL, messages: messages, temperature: 0.9, max_tokens: 150, reasoning_effort: 'low' })
    });
    const data = await res.json();
    let content = data.choices[0].message.content.trim();
    speak(content, faction);
    return content || '...';
  } catch (e) {
    return 'Связь прервалась.';
  }
}

/* =========================================================
   РЕНДЕР
   ========================================================= */
function subscribeToFaction(faction) {
  if (unsubMessages) unsubMessages();
  chatLog.innerHTML = '';

  const messagesRef = query(ref(db, 'chats/' + faction), limitToLast(50));
  unsubMessages = onValue(messagesRef, (snapshot) => {
    chatLog.innerHTML = '';
    const data = snapshot.val();
    if (data) {
      Object.values(data).forEach(msg => renderMessage(msg.role, msg.text, msg.user, msg.timestamp, faction));
    }
    chatLog.scrollTop = chatLog.scrollHeight;
  });
}

function renderMessage(role, text, senderName, timestamp, faction) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  if (role === 'assistant') {
    div.innerHTML = `<span class="name">${FACTION_NAMES[faction]}</span>`;
  } else if (senderName) {
    div.innerHTML = `<span class="name">${senderName}</span>`;
  }

  const textEl = document.createElement('span');
  textEl.textContent = text;
  div.appendChild(textEl);
  chatLog.appendChild(div);
}

/* =========================================================
   ГОЛОС
   ========================================================= */
const synth = window.speechSynthesis;
let voices = [];
synth.onvoiceschanged = () => { voices = synth.getVoices(); };
setTimeout(() => { voices = synth.getVoices(); }, 1000);

function unlockSpeech() {
  if (speechUnlocked) return;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); speechUnlocked = true; } catch(e){}
}

function speak(text, faction) {
  if (!text) return;
  try { synth.cancel(); } catch(e) {}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ru-RU';
  let voice = voices.find(v => v.lang.includes('ru'));
  if (voice) u.voice = voice;

  // Настройка голоса под каждую фракцию
  if (faction === 'cubes') { u.pitch = 0.5; u.rate = 0.9; }
  else if (faction === 'arta') { u.pitch = 1.2; u.rate = 1.0; }
  else if (faction === 'treugly') { u.pitch = 0.8; u.rate = 0.8; }
  
  synth.speak(u);
}

/* =========================================================
   МИКРОФОН (STT)
   ========================================================= */
async function startRecording() {
  try {
    if (!micStream) micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    let mimeType = MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : 'audio/webm';
    mediaRecorder = new MediaRecorder(micStream, { mimeType });
    mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(audioChunks, { type: mimeType });
      const formData = new FormData();
      formData.append('file', blob, 'rec.' + (mimeType.includes('mp4') ? 'mp4' : 'webm'));
      formData.append('model', STT_MODEL);
      formData.append('language', 'ru');
      try {
        const res = await fetch(STT_URL, { method: 'POST', headers: { 'Authorization': 'Bearer ' + API_KEY }, body: formData });
        const data = await res.json();
        if (data.text) sendMessage(data.text.trim());
      } catch (e) {}
    };
    mediaRecorder.start();
    isRecording = true;
    micBtn.classList.add('recording');
  } catch (e) { alert('Нет доступа к микрофону'); }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  isRecording = false;
  micBtn.classList.remove('recording');
}

/* =========================================================
   СОБЫТИЯ
   ========================================================= */
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    if (isBusy) return;
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentFaction = tab.dataset.faction;
    subscribeToFaction(currentFaction);
  });
});

sendBtn.addEventListener('click', () => {
  unlockSpeech();
  const text = textInput.value.trim();
  if (text) { textInput.value = ''; sendMessage(text); }
});

textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendBtn.click(); });
micBtn.addEventListener('click', () => { unlockSpeech(); if (isRecording) stopRecording(); else startRecording(); });

// Запуск
initUser();
subscribeToFaction('arta'); // Стартуем с Арты
</script>
</body>
</html>
